# Ad-hoc steering: comment "@claude <instruction>" on an issue or PR (owner only).
# Pushes use the bot token so CI and the review agent re-run on the changes.
name: agent-mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  respond:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --append-system-prompt "Follow CLAUDE.md. Never edit .github/**, never merge, never push to main. Agent branches start with agent/."
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(uv:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr create:*)"
