# Implementation agent: label one of YOUR issues `agent` -> Claude implements it on an
# agent/ branch and opens a PR. PRs are pushed with the bot's GitHub App token so CI and the
# review agent are triggered (pushes made with GITHUB_TOKEN would not trigger them).
name: agent-dev

on:
  issues:
    types: [labeled]

# One implementation agent at a time. Label issues one by one, in dependency order.
concurrency:
  group: agent-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  implement:
    # Only when the repo owner labels an issue the owner wrote.
    if: >-
      github.event.label.name == 'agent' &&
      github.event.sender.login == github.repository_owner &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Mint bot token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0

      - name: Configure git as the bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Implement issue
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          prompt: |
            You are the IMPLEMENTATION agent for this repository.
            Read CLAUDE.md fully first; it is the spec and your rules (section 9).

            Your task is GitHub issue #${{ github.event.issue.number }}.
            Read it with: gh issue view ${{ github.event.issue.number }} --comments

            Steps:
            1. If a "Depends on" issue is not merged into main yet, comment on the issue
               explaining what is missing and stop.
            2. Create branch agent/issue-${{ github.event.issue.number }}-<short-slug> from main.
            3. Implement the issue with tests. Tests must not hit the network.
            4. Run: uv run ruff format . && uv run ruff check . && uv run pytest -q
               Fix until all pass.
            5. Commit with clear messages and push the branch.
            6. Open a PR with gh pr create, base main, filling every section of
               .github/pull_request_template.md, including "Closes #${{ github.event.issue.number }}".
               Add the label `agent` to the PR (--label agent).
            Never edit .github/**, never merge, never push to main.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(uv:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*),Bash(gh pr view:*)"
